# Enterprise SaaS theme for the AutoDiscover demo: white canvas, slate ink,
# flat matte controls, one blue accent. System fonts only (no web-font
# download), so it renders the same offline on the demo laptop.

[theme]
base = "light"
primaryColor = "#0F172A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F8FAFC"
textColor = "#0F172A"
linkColor = "#2563EB"
blueColor = "#2563EB"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "0.5rem"
baseFontSize = 17
font = "Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "Inter, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace"
headingFontWeights = [700, 700, 650, 650, 600, 600]
headingFontSizes = ["2rem", "1.6rem", "1.35rem", "1.1rem", "1rem", "0.9rem"]
dataframeHeaderBackgroundColor = "#F8FAFC"
dataframeBorderColor = "#E2E8F0"

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#E2E8F0"
showSidebarBorder = true

[client]
toolbarMode = "minimal"
